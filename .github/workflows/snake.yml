name: Generate Snake Animation

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nadouulh
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg

      - name: Deploy to output branch
        run: |
          cd dist
          git init
          git checkout -b output
          git add .
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "Update snake animation"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/nadouulh/nadouulh.git
          git push --force origin output
